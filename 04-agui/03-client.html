<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>A.3 — AG-UI client</title>
<style>
  body { font-family: ui-monospace, monospace; background: #12151c; color: #e7eaf1; padding: 24px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 16px; color: #9aa3b2; }
  #log { background: #191d26; border: 1px solid #2d3442; border-radius: 8px; padding: 14px; font-size: 13px; white-space: pre-wrap; min-height: 120px; margin-top: 12px; }
  .ev { color: #767f91; }
  .tool { color: #4fc0b0; }
  .text { color: #e7eaf1; }
  input { width: 70%; background: #191d26; border: 1px solid #2d3442; color: #e7eaf1; padding: 8px; border-radius: 6px; font: inherit; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #6fb0ec; color: #0b1020; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <h1>🎯 A.3 — raw EventSource, no framework</h1>
  <div>
    <input id="q" value="What's the status of order A123?" />
    <button onclick="ask()">Send</button>
  </div>
  <div id="log"></div>

<script>
const log = document.getElementById("log");
let reply = "";

function line(text, cls) {
  const div = document.createElement("div");
  div.className = cls || "ev";
  div.textContent = text;
  log.appendChild(div);
}

function ask() {
  log.innerHTML = "";
  reply = "";
  const q = encodeURIComponent(document.getElementById("q").value);
  const es = new EventSource("/chat?q=" + q);

  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    switch (ev.type) {
      case "RUN_STARTED":
        line("● run started", "ev");
        break;
      case "TOOL_CALL_START":
        line("🔧 calling " + ev.toolCallName + "...", "tool");
        break;
      case "TOOL_CALL_RESULT":
        line("   -> " + ev.content, "tool");
        break;
      case "TEXT_MESSAGE_CONTENT":
        reply += ev.delta;
        // find or create the reply line, then update it in place
        let el = document.getElementById("reply-line");
        if (!el) {
          el = document.createElement("div");
          el.id = "reply-line";
          el.className = "text";
          log.appendChild(el);
        }
        el.textContent = reply;
        break;
      case "RUN_FINISHED":
        line("● run finished", "ev");
        es.close();
        break;
    }
  };

  es.onerror = () => { line("(connection closed)", "ev"); es.close(); };
}
</script>
</body>
</html>
