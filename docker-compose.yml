# Local Elasticsearch + Kibana for Module 2.4b (LEARNING setup — security disabled).
#   Start:   docker compose up -d
#   ES API:  http://localhost:9200
#   Kibana:  http://localhost:5601   (open "Dev Tools" — your query console)
#   Stop:    docker compose down          (keeps nothing; data lives only while running)
#   Wipe:    docker compose down -v        (also removes the data volume)
#
# NOTE: security is disabled so the JS client connects over plain http with no
# password/TLS. That is fine for local learning ONLY — never do this in production.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es-learn
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana-learn
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
